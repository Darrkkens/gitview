{{define "canvas"}}<main class="stage" id="stage" aria-label="Architecture canvas">
  <canvas id="canvas" tabindex="0" aria-label="Diagram. Use the explorer, search or the inspector to navigate it with the keyboard."></canvas>
  <div class="stage-top">
    <div class="viewbar" id="viewbar"></div>
    <div class="layerstrip" id="layerstrip" hidden></div>
  </div>
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Canvas">
    <button type="button" class="icon-btn" data-act="zoom-in" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
    <button type="button" class="icon-btn" data-act="zoom-out" title="Zoom out (−)" aria-label="Zoom out"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
    <button type="button" class="icon-btn" data-act="fit" title="Fit view (f)" aria-label="Fit view"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
    <span class="tb-sep"></span>
    <button type="button" class="icon-btn" data-act="focus" title="Focus mode: only the selection and its dependencies (.)" aria-label="Focus mode"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.5"/><path d="M8 1.5v2.5M8 12v2.5M1.5 8H4M12 8h2.5"/></svg></button>
    <button type="button" class="icon-btn" data-act="minimap" title="Minimap (m)" aria-label="Minimap"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1.5"/><rect x="8" y="8" width="4" height="3"/></svg></button>
    <button type="button" class="icon-btn" data-act="fullscreen" title="Fullscreen (Shift+F)" aria-label="Fullscreen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3"/></svg></button>
    <span class="tb-sep"></span>
    <button type="button" class="icon-btn" data-act="filters" id="filters-open" title="Filters (element and relation types, confidence)" aria-label="Filters" aria-haspopup="dialog"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12l-4.5 5.5V13l-3-1.5v-3z"/></svg><span class="dot-badge" id="filters-badge" hidden></span></button>
  </div>
  <div class="filters-pop" id="filters" role="dialog" aria-label="Filters" hidden></div>
  <div class="minimap" id="minimap-wrap"><canvas id="minimap" aria-label="Minimap"></canvas></div>
  <div class="legend" id="legend" aria-label="Legend"></div>
  <div class="stage-state" id="stage-state" role="status" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</main>
{{end}}
