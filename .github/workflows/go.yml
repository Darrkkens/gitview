name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # The web UI build is committed (go install needs no Node): check that
    # it matches the sources.
    - name: Web UI
      run: make web-check

    - name: Type check
      run: npm run typecheck --prefix frontend

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
